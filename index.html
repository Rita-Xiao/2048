<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>2048 · Little Meadow</title>
  <meta name="description" content="A cozy little 2048 adventure. Combine pastel tiles, meet woodland friends, and make a little magic.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf7ed">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link href="style/storybook.css" rel="stylesheet">
  <link rel="icon" href="style/meadow.svg" type="image/svg+xml">
</head>
<body>
  <main class="container">
    <section class="welcome" aria-labelledby="game-title">
      <h1 id="game-title" class="title">2048<span class="title-flower" aria-hidden="true">✿</span></h1>
    </section>
    <div class="play-area">
      <section class="game" aria-label="2048 game" data-i18n-aria="game">
        <div class="above-game">
          <div class="scores-container"><div class="score-container" data-label="SCORE" data-i18n-aria="scoreLabel" aria-label="Score" aria-live="polite">0</div><div class="best-container" data-label="BEST" data-i18n-aria="bestLabel" aria-label="Best score">0</div></div>
          <div class="game-actions">
            <button class="restart-button" type="button"><span aria-hidden="true">↻</span> <span class="button-label" data-i18n="newGame">New game</span></button>
            <button class="language-button" type="button" lang="zh-Hans" aria-label="Switch to Simplified Chinese">中文</button>
          </div>
        </div>
        <div class="game-container" data-i18n-aria="board" role="group" aria-label="2048 tile board. Use arrow keys or swipe to play.">
          <div class="game-message" role="status"><span class="message-star" aria-hidden="true">✧</span><p></p><div class="lower"><button class="keep-playing-button" data-i18n="keepPlaying" type="button">Keep growing</button><button class="retry-button" data-i18n="retry" type="button">Begin again</button></div></div>
          <div class="grid-container" aria-hidden="true">
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
          </div>
          <div class="tile-container"></div>
          <div class="merge-effects" aria-hidden="true"></div>
        </div>
        <div class="merge-announcement sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
      </section>
      <aside class="meadow-friends">
        <div class="art-wrap"><img class="meadow-art" src="style/assets/meadow-forest-friends.png" alt="Totoro, little blue and white forest spirits, and soot sprites keeping a sleepy cat and bunny company in a watercolor meadow."></div>
      </aside>
    </div>
  </main>
  <script src="js/bind_polyfill.js"></script>
  <script src="js/classlist_polyfill.js"></script>
  <script src="js/animframe_polyfill.js"></script>
  <script src="js/keyboard_input_manager.js"></script>
  <script src="js/language.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/local_storage_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/application.js"></script>
</body>
</html>
